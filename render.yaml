services:
  - type: web
    name: ai-office-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start --workspace=@ai-office/backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
